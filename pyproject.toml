[project]
name = "fatality"
version = "0.1.0"
description = "Scavenge everything recoverable from broken FAT filesystems: orphaned entries, stale directories, former formats, with specialised JPEG/MP4/GoPro extraction"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [ "numpy>=2.0" ]

[project.optional-dependencies]
verify = [ "pillow>=10.0" ]
dev = [ "pytest>=8.0", "pillow>=10.0" ]

[project.scripts]
fatality = "fatality.cli:main"

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [ "src/fatality" ]
