[project]
name = "fatality"
version = "0.1.0"
description = "Scavenge everything recoverable from broken FAT filesystems: orphaned entries, stale directories, former formats, with specialised JPEG/MP4/GoPro extraction"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [ "numpy>=2.0", "rich>=13" ]

[project.optional-dependencies]
verify = [ "pillow>=10.0" ]
dev = [ "pytest>=8.0", "pillow>=10.0", "mypy>=1.11", "ruff>=0.6", "types-pillow" ]

[project.scripts]
fatality = "fatality.cli:main"

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [ "src/fatality" ]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [ "E", "F", "W", "I", "B", "UP", "SIM" ]
ignore = ["SIM108"]   # ternaries are not automatically clearer

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
files = ["src/fatality", "tools"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
