name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install python + project (dev extras)
        run: |
          uv python install 3.12
          uv venv .venv --python 3.12
          uv pip install -e '.[dev]'

      - name: ruff
        run: .venv/bin/ruff check src tests

      - name: mypy
        run: .venv/bin/mypy

      - name: pytest
        run: .venv/bin/python -m pytest tests/ -q
        # gold tests skip themselves when the (large) evidence image is absent
